<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1176" width="1020" height="1176"><style>
    text { font-family: 'DejaVu Sans', sans-serif; }
    .phname { font-size: 15px; font-weight: 700; letter-spacing: 2.4px; }
    .phtag  { font-size: 13.5px; fill: #6b7280; font-style: italic; }
    .ntitle { font-size: 17px; font-weight: 700; fill: #14161a; }
    .nsub   { font-size: 13.5px; fill: #6b7280; }
    .chip   { font-size: 12.5px; font-weight: 700; fill: #14161a;
               text-anchor: middle; letter-spacing: .3px; }
    .nnum   { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .flag   { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px;
               text-anchor: end; }
    </style><line x1="30" y1="79.0" x2="30" y2="1135.0" stroke="#e4e4e8" stroke-width="2.4"/><circle cx="30" cy="79.0" r="13.5" fill="#fff" stroke="#c2185b" stroke-width="2.2"/><text x="30" y="83.6" class="nnum" fill="#c2185b">1</text><circle cx="30" cy="154.0" r="13.5" fill="#fff" stroke="#c2185b" stroke-width="2.2"/><text x="30" y="158.6" class="nnum" fill="#c2185b">2</text><circle cx="30" cy="281.0" r="13.5" fill="#fff" stroke="#7b3fa0" stroke-width="2.2"/><text x="30" y="285.6" class="nnum" fill="#7b3fa0">3</text><circle cx="30" cy="356.0" r="13.5" fill="#fff" stroke="#7b3fa0" stroke-width="2.2"/><text x="30" y="360.6" class="nnum" fill="#7b3fa0">4</text><circle cx="30" cy="431.0" r="13.5" fill="#fff" stroke="#7b3fa0" stroke-width="2.2"/><text x="30" y="435.6" class="nnum" fill="#7b3fa0">5</text><circle cx="30" cy="506.0" r="13.5" fill="#fff" stroke="#7b3fa0" stroke-width="2.2"/><text x="30" y="510.6" class="nnum" fill="#7b3fa0">6</text><circle cx="30" cy="633.0" r="13.5" fill="#fff" stroke="#0f766e" stroke-width="2.2"/><text x="30" y="637.6" class="nnum" fill="#0f766e">7</text><circle cx="30" cy="708.0" r="13.5" fill="#fff" stroke="#0f766e" stroke-width="2.2"/><text x="30" y="712.6" class="nnum" fill="#0f766e">8</text><circle cx="30" cy="783.0" r="13.5" fill="#fff" stroke="#0f766e" stroke-width="2.2"/><text x="30" y="787.6" class="nnum" fill="#0f766e">9</text><circle cx="30" cy="858.0" r="13.5" fill="#fff" stroke="#0f766e" stroke-width="2.2"/><text x="30" y="862.6" class="nnum" fill="#0f766e">10</text><circle cx="30" cy="985.0" r="13.5" fill="#fff" stroke="#b4531f" stroke-width="2.2"/><text x="30" y="989.6" class="nnum" fill="#b4531f">11</text><circle cx="30" cy="1060.0" r="13.5" fill="#fff" stroke="#b4531f" stroke-width="2.2"/><text x="30" y="1064.6" class="nnum" fill="#b4531f">12</text><circle cx="30" cy="1135.0" r="13.5" fill="#fff" stroke="#b4531f" stroke-width="2.2"/><text x="30" y="1139.6" class="nnum" fill="#b4531f">13</text><text x="66" y="28" class="phname" fill="#c2185b">ANALYSE</text><text x="174.89999999999998" y="28" class="phtag">What is the reference actually doing?</text><line x1="66" y1="37" x2="1020" y2="37" stroke="#c2185b" stroke-width="1.6" opacity=".35"/><rect x="66" y="48" width="954" height="62" rx="6" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.4"/><rect x="66" y="48" width="4.5" height="62" rx="2.2" fill="#c2185b"/><text x="86" y="73" class="ntitle">Select the competitor ad</text><text x="86" y="93" class="nsub">Search the brand, filter to long-running ads, download the MP4</text><rect x="873.0" y="61" width="133.0" height="22" rx="11" fill="#f6f6f8" stroke="#e4e4e8" stroke-width="1"/><text x="939.5" y="76" class="chip">Ad Intelligence</text><rect x="66" y="123" width="954" height="62" rx="6" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.4"/><rect x="66" y="123" width="4.5" height="62" rx="2.2" fill="#c2185b"/><text x="86" y="148" class="ntitle">Analyse the video</text><text x="86" y="168" class="nsub">Cut detection → shot list, hook / mid / CTA split, B-roll map, hook motion</text><rect x="939.6" y="136" width="66.4" height="22" rx="11" fill="#f6f6f8" stroke="#e4e4e8" stroke-width="1"/><text x="972.8" y="151" class="chip">Claude</text><text x="66" y="230" class="phname" fill="#7b3fa0">SCRIPT &amp; CHARACTER</text><text x="314.6" y="230" class="phtag">Lock everything that must stay identical</text><line x1="66" y1="239" x2="1020" y2="239" stroke="#7b3fa0" stroke-width="1.6" opacity=".35"/><rect x="66" y="250" width="954" height="62" rx="6" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.4"/><rect x="66" y="250" width="4.5" height="62" rx="2.2" fill="#7b3fa0"/><text x="86" y="275" class="ntitle">Rewrite the script</text><text x="86" y="295" class="nsub">Clone-and-swap the product and ingredients, or write a new lead to the same beats</text><rect x="939.6" y="263" width="66.4" height="22" rx="11" fill="#f6f6f8" stroke="#e4e4e8" stroke-width="1"/><text x="972.8" y="278" class="chip">Claude</text><rect x="66" y="325" width="954" height="62" rx="6" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.4"/><rect x="66" y="325" width="4.5" height="62" rx="2.2" fill="#7b3fa0"/><text x="86" y="350" class="ntitle">Normalise Hinglish</text><text x="86" y="370" class="nsub">Romanised Hindi → Devanagari, so voice generation says it correctly</text><rect x="939.6" y="338" width="66.4" height="22" rx="11" fill="#f6f6f8" stroke="#e4e4e8" stroke-width="1"/><text x="972.8" y="353" class="chip">Claude</text><rect x="66" y="400" width="954" height="62" rx="6" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.4"/><rect x="66" y="400" width="4.5" height="62" rx="2.2" fill="#7b3fa0"/><text x="86" y="425" class="ntitle">Lock the avatar</text><text x="86" y="445" class="nsub">Age and gender read from the reference → reference sheet the whole video inherits</text><rect x="917.4" y="413" width="88.60000000000001" height="22" rx="11" fill="#f6f6f8" stroke="#e4e4e8" stroke-width="1"/><text x="961.7" y="428" class="chip">GPT-Image</text><text x="865.4" y="428" class="flag" fill="#6b7280">QC GATE</text><rect x="66" y="475" width="954" height="62" rx="6" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.4"/><rect x="66" y="475" width="4.5" height="62" rx="2.2" fill="#7b3fa0"/><text x="86" y="500" class="ntitle">Chunk into beats</text><text x="86" y="520" class="nsub">Hook stays whole · every other beat ≤ 10 s · never split a sentence or a Q&amp;A</text><rect x="939.6" y="488" width="66.4" height="22" rx="11" fill="#f6f6f8" stroke="#e4e4e8" stroke-width="1"/><text x="972.8" y="503" class="chip">Claude</text><text x="66" y="582" class="phname" fill="#0f766e">GENERATE</text><text x="187.6" y="582" class="phtag">Make the shots, one beat at a time</text><line x1="66" y1="591" x2="1020" y2="591" stroke="#0f766e" stroke-width="1.6" opacity=".35"/><rect x="66" y="602" width="954" height="62" rx="6" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.4"/><rect x="66" y="602" width="4.5" height="62" rx="2.2" fill="#0f766e"/><text x="86" y="627" class="ntitle">Generate the A-roll</text><text x="86" y="647" class="nsub">One talking-head clip per beat, checked against the reference sheet</text><rect x="880.4" y="615" width="125.60000000000001" height="22" rx="11" fill="#f6f6f8" stroke="#e4e4e8" stroke-width="1"/><text x="943.2" y="630" class="chip">Higgsfield MCP</text><text x="828.4" y="630" class="flag" fill="#6b7280">QC GATE</text><rect x="66" y="677" width="954" height="62" rx="6" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.4"/><rect x="66" y="677" width="4.5" height="62" rx="2.2" fill="#0f766e"/><text x="86" y="702" class="ntitle">Rebuild the hook</text><text x="86" y="722" class="nsub">Motion prompt from the reference, performed by the locked avatar</text><rect x="880.4" y="690" width="125.60000000000001" height="22" rx="11" fill="#f6f6f8" stroke="#e4e4e8" stroke-width="1"/><text x="943.2" y="705" class="chip">Higgsfield MCP</text><text x="828.4" y="705" class="flag" fill="#6b7280">QC GATE</text><rect x="66" y="752" width="954" height="62" rx="6" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.4"/><rect x="66" y="752" width="4.5" height="62" rx="2.2" fill="#0f766e"/><text x="86" y="777" class="ntitle">Composite the CTA card</text><text x="86" y="797" class="nsub">Product image dropped into the standardised 3–4 s end card</text><rect x="880.4" y="765" width="125.60000000000001" height="22" rx="11" fill="#f6f6f8" stroke="#e4e4e8" stroke-width="1"/><text x="943.2" y="780" class="chip">Higgsfield MCP</text><rect x="66" y="827" width="954" height="62" rx="6" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.4"/><rect x="66" y="827" width="4.5" height="62" rx="2.2" fill="#0f766e"/><text x="86" y="852" class="ntitle">Generate the B-roll</text><text x="86" y="872" class="nsub">Inserts rebuilt at the positions the analysis reported</text><rect x="880.4" y="840" width="125.60000000000001" height="22" rx="11" fill="#f6f6f8" stroke="#e4e4e8" stroke-width="1"/><text x="943.2" y="855" class="chip">Higgsfield MCP</text><text x="66" y="934" class="phname" fill="#b4531f">ASSEMBLE</text><text x="187.6" y="934" class="phtag">Cut it together and ship</text><line x1="66" y1="943" x2="1020" y2="943" stroke="#b4531f" stroke-width="1.6" opacity=".35"/><rect x="66" y="954" width="954" height="62" rx="6" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.4"/><rect x="66" y="954" width="4.5" height="62" rx="2.2" fill="#b4531f"/><text x="86" y="979" class="ntitle">Lay the timeline</text><text x="86" y="999" class="nsub">Clips placed in script order, hook at the head, CTA at the tail</text><rect x="895.2" y="967" width="110.80000000000001" height="22" rx="11" fill="#f6f6f8" stroke="#e4e4e8" stroke-width="1"/><text x="950.6" y="982" class="chip">Premiere MCP</text><rect x="66" y="1029" width="954" height="62" rx="6" fill="#fff8f2" stroke="#b4531f" stroke-width="1.4"/><rect x="66" y="1029" width="4.5" height="62" rx="2.2" fill="#b4531f"/><text x="86" y="1054" class="ntitle">Trim the B-roll to fit</text><text x="86" y="1074" class="nsub">Inserts overrun their slots — the editor trims by hand, A-roll is never stretched</text><rect x="939.6" y="1042" width="66.4" height="22" rx="11" fill="#f6f6f8" stroke="#e4e4e8" stroke-width="1"/><text x="972.8" y="1057" class="chip">Editor</text><text x="875.6" y="1057" class="flag" fill="#b4531f">MANUAL</text><rect x="66" y="1104" width="954" height="62" rx="6" fill="#ffffff" stroke="#e4e4e8" stroke-width="1.4"/><rect x="66" y="1104" width="4.5" height="62" rx="2.2" fill="#b4531f"/><text x="86" y="1129" class="ntitle">Sound, captions, export</text><text x="86" y="1149" class="nsub">SFX and BGM from the in-house repo · captions on every frame · H.264 9:16</text><rect x="895.2" y="1117" width="110.80000000000001" height="22" rx="11" fill="#f6f6f8" stroke="#e4e4e8" stroke-width="1"/><text x="950.6" y="1132" class="chip">Premiere Pro</text></svg>